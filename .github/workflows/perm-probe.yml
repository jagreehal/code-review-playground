name: perm-probe
on: pull_request
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          echo "perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/jagreehal/permission" --jq .permission)"
          echo "reviews=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/reviews" --paginate | jq -s 'add // [] | length')"
