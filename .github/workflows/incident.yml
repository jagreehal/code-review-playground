# incident: a red run on main, or an error sent in by hand or by an alerting tool, becomes an incident issue,
# a reproducing test and a fix PR (shepherd's incident skill). The PR then goes through ci, stamp and shepherd.
#
# Triggers:
#   ci fails on a push to main                        -> the run URL is the signal
#   workflow_dispatch with `error`                     -> paste an error or stack trace
#   repository_dispatch type `incident`, payload.error -> an alerting tool posts the error
# workflow_run fires only for this file on the default branch, so a PR cannot change it.
#
# The signal is untrusted text (alert payloads carry user input), so the agent's job can read the repo and
# file issues, nothing more: no contents write, no credential in its checkout. It hands its commit over as a
# git bundle; the `open` job, which runs no model, pushes only an `incident/<n>` branch that builds on main
# and leaves .github/ alone, then opens the PR. The agent still holds the model key.
#
# Secrets: SHEPHERD_TOKEN (contents, pull requests: write) for `open`, so the fix PR starts ci and stamp;
# with github.token the PR opens but no workflow runs on it. OPENCODE_API_KEY, else ANTHROPIC_API_KEY holding an OpenCode key.
name: incident
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      error:
        description: Error, stack trace or alert text
        required: true
  repository_dispatch:
    types: [incident]

concurrency:
  group: incident # one at a time, so a second signal for the same failure dedupes against the first issue
  cancel-in-progress: false

permissions: {}

jobs:
  investigate:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == github.event.repository.default_branch)
      || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jagreehal/shepherd
          ref: 8a769e90f9857044692417ccc1aef42ac3df4bb9 # pinned: runs with the repo's secrets
          path: .shepherd-tool
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - shell: bash # -eo pipefail: a failed download fails here, not three steps later
        run: |
          npm ci
          bun install --frozen-lockfile --cwd .shepherd-tool
          bun .shepherd-tool/src/cli.ts install
          rm -rf .shepherd-tool
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.0
          "$HOME/.opencode/bin/opencode" --version # fails the step if the install did not land
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/handoff"
      - name: Write the signal
        env: # through env, never ${{ }} in the script: the error text is untrusted
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          INPUT_ERROR: ${{ github.event.inputs.error }}
          PAYLOAD_ERROR: ${{ github.event.client_payload.error }}
        run: |
          if [ -n "$RUN_URL" ]; then echo "$RUN_URL" > "$RUNNER_TEMP/signal.txt"
          else printf '%s\n' "${INPUT_ERROR:-$PAYLOAD_ERROR}" > "$RUNNER_TEMP/signal.txt"; fi
      - name: Incident
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY || secrets.ANTHROPIC_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          MODEL: ${{ vars.SHEPHERD_MODEL || 'opencode-go/kimi-k3' }}
          HANDOFF: ${{ runner.temp }}/handoff
        run: |
          opencode run --auto -m "$MODEL" --title "incident" "Load the incident skill and run it on the signal in $RUNNER_TEMP/signal.txt
          (a run URL, or an error or alert text).
          You are running in GitHub Actions on the default branch, already checked out, with no push access.
          At Step 6 do not push or open the PR: commit on incident/<issue>, write the PR title to $HANDOFF/pr-title.txt
          and the body to $HANDOFF/pr-body.md; the next job pushes and opens it.
          Nobody is watching this session: never wait for an answer. Anything you would ask is reported in the final JSON."
      - name: Bundle the fix branch
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          branch=$(git branch --list 'incident/*' --format='%(refname:short)' | head -1)
          [ -n "$branch" ] || { echo "no fix branch: see the incident issue"; exit 0; }
          echo "$branch" > "$RUNNER_TEMP/handoff/branch"
          git bundle create "$RUNNER_TEMP/handoff/fix.bundle" "origin/$DEFAULT..$branch"
      - uses: actions/upload-artifact@v4
        with:
          name: incident-handoff
          path: ${{ runner.temp }}/handoff
          if-no-files-found: ignore

  open:
    needs: investigate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        id: handoff
        continue-on-error: true # no artifact: no fix branch
        with:
          name: incident-handoff
          path: handoff
      - if: steps.handoff.outcome == 'success' && hashFiles('handoff/fix.bundle') != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: repo
          token: ${{ secrets.SHEPHERD_TOKEN || github.token }}
      - if: steps.handoff.outcome == 'success' && hashFiles('handoff/fix.bundle') != ''
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.SHEPHERD_TOKEN || github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          branch=$(cat ../handoff/branch)
          [[ "$branch" =~ ^incident/[0-9]+$ ]] || { echo "::error::unexpected branch name"; exit 1; }
          git fetch -q ../handoff/fix.bundle "$branch:$branch"
          git merge-base --is-ancestor "origin/$DEFAULT" "$branch" || { echo "::error::$branch does not build on $DEFAULT"; exit 1; }
          if git diff --name-only "origin/$DEFAULT...$branch" | grep -q '^\.github/'; then echo "::error::the fix touches .github/; a person should look"; exit 1; fi
          git push origin "$branch:refs/heads/$branch"
          gh pr create --base "$DEFAULT" --head "$branch" --title "$(head -c 200 ../handoff/pr-title.txt)" --body-file ../handoff/pr-body.md
