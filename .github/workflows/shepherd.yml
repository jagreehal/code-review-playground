# shepherd in CI: one loop iteration each time CI or stamp finishes on a PR, or on a `/shepherd` comment.
# Each iteration pushes fixes, CI and stamp run on the new head, and their completion starts the next one,
# until shepherd sets a final `shepherd` status (success, or failure naming what the author must do).
#
# Secrets:
#   SHEPHERD_TOKEN    fine-grained PAT: contents, pull requests, commit statuses (read/write), actions (read).
#                     Pushes made with github.token start no workflows, so the loop would stall after one fix.
#   OPENCODE_API_KEY  the models (any provider: set the matching key and the ladder in .shepherd/lenses.yml).
# workflow_run fires only for this file on the default branch, so a PR cannot change how it is shepherded.
name: shepherd
on:
  workflow_run:
    workflows: [ci, stamp]
    types: [completed]
  issue_comment:
    types: [created]

concurrency:
  group: shepherd-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number }}
  cancel-in-progress: false # an iteration may be mid-push; later triggers queue, and GitHub keeps only the newest

permissions:
  contents: read

jobs:
  iterate:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.pull_requests[0] != null
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/shepherd')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number }}
      GH_TOKEN: ${{ secrets.SHEPHERD_TOKEN || github.token }}
      MAX_SHEPHERD_COMMITS: 20
    steps:
      - name: Decide whether this iteration is worth running
        id: gate
        run: |
          pr=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state,author,headRefOid,headRefName,isCrossRepository,commits)
          state=$(jq -r .state <<<"$pr"); head=$(jq -r .headRefOid <<<"$pr"); author=$(jq -r .author.login <<<"$pr")
          skip() { echo "skip: $1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$state" = OPEN ] || skip "PR is $state"
          [ "$(jq -r .isCrossRepository <<<"$pr")" = false ] || skip "fork PR"
          # Only PRs by people who could push this code themselves: shepherd runs their checks with these secrets.
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|maintain|write) ;; *) skip "author $author has $perm access" ;; esac
          if [ "${{ github.event_name }}" = workflow_run ]; then
            done=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" --jq '[.statuses[] | select(.context=="shepherd")][0].state // ""')
            case "$done" in success|failure) skip "shepherd already finished on $head ($done); comment /shepherd to run again" ;; esac
          fi
          n=$(jq '[.commits[] | select(.messageBody | test("^Shepherd: "; "m"))] | length' <<<"$pr")
          if [ "$n" -ge "$MAX_SHEPHERD_COMMITS" ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f context=shepherd -f state=failure -f description="stopped after $n shepherd commits; a person should look" >/dev/null
            skip "$n shepherd commits"
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"; echo "branch=$(jq -r .headRefName <<<"$pr")" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.SHEPHERD_TOKEN || github.token }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: jagreehal/shepherd
          ref: 6e1de9fa900ce16981ec4452148095e5adaba89b # pinned: this runs with write access and the repo's secrets, so never a mutable ref
          path: .shepherd-tool
      - if: steps.gate.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: |
          npm ci
          bun install --frozen-lockfile --cwd .shepherd-tool
          bun .shepherd-tool/src/cli.ts install   # skills to ~/.claude/skills, where opencode finds them
          rm -rf .shepherd-tool                   # nothing of the tool stays in the tree shepherd commits from
          curl -fsSL https://opencode.ai/install | bash -s -- --version 2.0.18 && echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          git config user.name "$(gh api user --jq .login)"
          git config user.email "$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')"
      - if: steps.gate.outputs.run == 'true'
        name: One shepherd iteration
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "1" # the checkout's opencode.json, .opencode/ plugins and AGENTS.md are PR content
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          MODEL: ${{ vars.SHEPHERD_MODEL || 'opencode-go/kimi-k3' }}
        run: |
          opencode run --auto -m "$MODEL" --title "shepherd #$PR" "Load the shepherd skill and run exactly one iteration on PR $PR.
          You are running in GitHub Actions on the PR branch, already checked out; push with plain git push.
          Nobody is watching this session: never wait for an answer. Anything you would ask the user is deferred,
          listed in the iteration summary, and named in the shepherd commit status. Do not schedule further iterations;
          the next one starts when CI or stamp finishes on the head you push."
