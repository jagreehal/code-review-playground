# stamp trial: runs the CLI straight from the public repo, no npm publish yet.
name: stamp
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]

concurrency:
  group: stamp-${{ github.event.pull_request.number || github.event.issue.number }}-${{ ((github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/stamp') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))) && 'review' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/stamp')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: jagreehal/stamp
          ref: 70202ae8af5af9cc61fe5d2166a21b8871b3a6bb # pinned: this runs with the repo's secrets, so never a mutable ref
          path: .stamp-tool
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --cwd .stamp-tool
      - run: bun .stamp-tool/src/cli.ts "$PR" --post --json "$RUNNER_TEMP/stamp.json"
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          STAMP_BOT_LOGIN: github-actions[bot]
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STAMP_MODEL: ${{ vars.STAMP_MODEL || secrets.STAMP_MODEL }} # a variable, so logs show which model ran
          STAMP_API_KEY: ${{ secrets.STAMP_API_KEY }}
          STAMP_NOTIFY_WEBHOOK: ${{ secrets.STAMP_NOTIFY_WEBHOOK }}
          STAMP_NOTIFY_ON: REFUSED,ESCALATE,ERROR,APPROVED # trial: every verdict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stamp-evidence-${{ github.event.pull_request.number || github.event.issue.number }}
          path: ${{ runner.temp }}/stamp.json
